description: Dataiku is sold via three on-ramps. A 14-day Cloud Trial requires no credit card,
  supports up to 5 users, allocates 4 CPUs and 32 GB of elastic compute, and includes all features
  except Govern and advanced LLM Mesh. A Free Edition is downloadable for on-prem installation on
  Mac, Linux, and Windows (experimental). Commercial editions (Discover, Business, Enterprise) and
  Govern are quoted by sales — Dataiku does not publish numeric per-user / per-node prices on the
  public website.
sources:
  - https://www.dataiku.com/product/get-started/
  - https://www.dataiku.com
notes: Cloud Trial details are public. Commercial edition prices are gated behind sales contact.
