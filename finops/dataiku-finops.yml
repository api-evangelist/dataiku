alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Dataiku
providerId: dataiku
publisherName: Dataiku
serviceCategory: AI Platform
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - Artificial Intelligence
  - Data Platform
  - Machine Learning
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Dataiku: enterprise SaaS / on-prem subscription billed
  primarily by user (seat) tier and node count, with optional Govern and LLM Mesh add-ons. Cloud
  Trial and Free Edition are no-charge. Commercial pricing is quoted by sales and is not public.'
sources:
  - https://www.dataiku.com/product/get-started/
  - https://www.dataiku.com
notes: No public commercial pricing. Meters reflect the typical Dataiku billing shape (seats,
  nodes, compute) but dollar values are contract-specific.
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
focusColumns:
  ServiceName: Dataiku
  ServiceCategory: AI Platform
  ServiceSubcategory: Data Science Platform
  ProviderName: Dataiku
  PublisherName: Dataiku
  InvoiceIssuerName: Dataiku
  PricingCategory: Subscription
  PricingUnit: seat
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: user_seats
    description: Active named-user seats by edition (Discover, Business, Enterprise). Primary
      billable line.
    unit: seat
    aggregation: max
    dimensions:
      - edition
      - role
      - tenant
  - name: dss_nodes
    description: DSS design / automation / API nodes provisioned in the deployment.
    unit: node
    aggregation: max
    dimensions:
      - node_type
      - environment
  - name: api_node_compute
    description: Real-time scoring compute consumed by API Node services.
    unit: instance-hour
    aggregation: sum
    dimensions:
      - service
      - environment
  - name: govern_addon
    description: Dataiku Govern add-on subscription.
    unit: month
    aggregation: max
    dimensions:
      - tenant
  - name: llm_mesh_tokens
    description: LLM token consumption routed through advanced LLM Mesh (passthrough to upstream
      providers; LLM Mesh itself is a feature-add).
    unit: token
    aggregation: sum
    dimensions:
      - model
      - upstream_provider
principles:
  - name: Visibility
    description: Use the DSS administration UI for active-user counts, node inventory, and project
      activity. Reconcile against the Dataiku invoice quarterly. For LLM Mesh, attribute upstream
      provider charges back to the calling project.
  - name: Allocation
    description: Use Dataiku project ownership and group membership to attribute seats and node
      hours back to consuming teams. Tag API Node services with environment and team.
  - name: Optimization
    description: Reclaim inactive seats during renewal, right-size design vs automation node
      counts, schedule API Node downscaling for low-traffic windows, and prefer batch scoring for
      non-real-time workloads.
  - name: Accountability
    description: Designate a Dataiku platform owner who reviews seat utilization, node sprawl, and
      LLM Mesh spend monthly; align renewals with team-level ROI evidence.
maintainers:
