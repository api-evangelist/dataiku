naftiko: 1.0.0-alpha2
info:
  label: Dataiku Govern API — Blueprints
  description: 'Dataiku Govern API — Blueprints. 5 operations. Lead operation: Dataiku List blueprints. Self-contained Naftiko
    capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Blueprints
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: govern-blueprints
    baseUri: https://{govern-host}/public/api
    description: Dataiku Govern API — Blueprints business capability. Self-contained, no shared references.
    resources:
    - name: blueprints
      path: /blueprints
      operations:
      - name: listblueprints
        method: GET
        description: Dataiku List blueprints
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createblueprint
        method: POST
        description: Dataiku Create a blueprint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: blueprints-blueprintId
      path: /blueprints/{blueprintId}
      operations:
      - name: getblueprint
        method: GET
        description: Dataiku Get blueprint details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateblueprint
        method: PUT
        description: Dataiku Update a blueprint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteblueprint
        method: DELETE
        description: Dataiku Delete a blueprint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: govern-blueprints-rest
    port: 8080
    description: REST adapter for Dataiku Govern API — Blueprints. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/blueprints
      name: blueprints
      description: REST surface for blueprints.
      operations:
      - method: GET
        name: listblueprints
        description: Dataiku List blueprints
        call: govern-blueprints.listblueprints
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createblueprint
        description: Dataiku Create a blueprint
        call: govern-blueprints.createblueprint
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/blueprints/{blueprintid}
      name: blueprints-blueprintid
      description: REST surface for blueprints-blueprintId.
      operations:
      - method: GET
        name: getblueprint
        description: Dataiku Get blueprint details
        call: govern-blueprints.getblueprint
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateblueprint
        description: Dataiku Update a blueprint
        call: govern-blueprints.updateblueprint
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteblueprint
        description: Dataiku Delete a blueprint
        call: govern-blueprints.deleteblueprint
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: govern-blueprints-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku Govern API — Blueprints. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: dataiku-list-blueprints
      description: Dataiku List blueprints
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: govern-blueprints.listblueprints
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-create-blueprint
      description: Dataiku Create a blueprint
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: govern-blueprints.createblueprint
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-blueprint-details
      description: Dataiku Get blueprint details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: govern-blueprints.getblueprint
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-update-blueprint
      description: Dataiku Update a blueprint
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: govern-blueprints.updateblueprint
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-delete-blueprint
      description: Dataiku Delete a blueprint
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: govern-blueprints.deleteblueprint
      outputParameters:
      - type: object
        mapping: $.
