naftiko: 1.0.0-alpha2
info:
  label: Dataiku DSS Public API — Jobs
  description: 'Dataiku DSS Public API — Jobs. 4 operations. Lead operation: Dataiku List jobs. Self-contained Naftiko capability
    covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-jobs
    baseUri: https://{dss-host}/public/api
    description: Dataiku DSS Public API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectKey-jobs
      path: /projects/{projectKey}/jobs
      operations:
      - name: listjobs
        method: GET
        description: Dataiku List jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: startjob
        method: POST
        description: Dataiku Start a new job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: projects-projectKey-jobs-jobId
      path: /projects/{projectKey}/jobs/{jobId}
      operations:
      - name: getjob
        method: GET
        description: Dataiku Get job status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: abortjob
        method: DELETE
        description: Dataiku Abort a job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-jobs-rest
    port: 8080
    description: REST adapter for Dataiku DSS Public API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/projects/{projectkey}/jobs
      name: projects-projectkey-jobs
      description: REST surface for projects-projectKey-jobs.
      operations:
      - method: GET
        name: listjobs
        description: Dataiku List jobs
        call: public-jobs.listjobs
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: startjob
        description: Dataiku Start a new job
        call: public-jobs.startjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectkey}/jobs/{jobid}
      name: projects-projectkey-jobs-jobid
      description: REST surface for projects-projectKey-jobs-jobId.
      operations:
      - method: GET
        name: getjob
        description: Dataiku Get job status
        call: public-jobs.getjob
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: abortjob
        description: Dataiku Abort a job
        call: public-jobs.abortjob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku DSS Public API — Jobs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: dataiku-list-jobs
      description: Dataiku List jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-jobs.listjobs
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-start-new-job
      description: Dataiku Start a new job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: public-jobs.startjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-job-status
      description: Dataiku Get job status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-jobs.getjob
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-abort-job
      description: Dataiku Abort a job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: public-jobs.abortjob
      outputParameters:
      - type: object
        mapping: $.
