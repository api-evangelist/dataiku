naftiko: 1.0.0-alpha2
info:
  label: Dataiku DSS Public API — Groups
  description: 'Dataiku DSS Public API — Groups. 2 operations. Lead operation: Dataiku List groups. Self-contained Naftiko
    capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-groups
    baseUri: https://{dss-host}/public/api
    description: Dataiku DSS Public API — Groups business capability. Self-contained, no shared references.
    resources:
    - name: admin-groups
      path: /admin/groups
      operations:
      - name: listgroups
        method: GET
        description: Dataiku List groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: admin-groups-groupName
      path: /admin/groups/{groupName}
      operations:
      - name: getgroup
        method: GET
        description: Dataiku Get group details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-groups-rest
    port: 8080
    description: REST adapter for Dataiku DSS Public API — Groups. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/admin/groups
      name: admin-groups
      description: REST surface for admin-groups.
      operations:
      - method: GET
        name: listgroups
        description: Dataiku List groups
        call: public-groups.listgroups
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/admin/groups/{groupname}
      name: admin-groups-groupname
      description: REST surface for admin-groups-groupName.
      operations:
      - method: GET
        name: getgroup
        description: Dataiku Get group details
        call: public-groups.getgroup
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku DSS Public API — Groups. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: dataiku-list-groups
      description: Dataiku List groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-groups.listgroups
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-group-details
      description: Dataiku Get group details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-groups.getgroup
      outputParameters:
      - type: object
        mapping: $.
