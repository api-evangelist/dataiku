naftiko: 1.0.0-alpha2
info:
  label: Dataiku DSS Public API — Plugins
  description: 'Dataiku DSS Public API — Plugins. 2 operations. Lead operation: Dataiku List plugins. Self-contained Naftiko
    capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Plugins
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-plugins
    baseUri: https://{dss-host}/public/api
    description: Dataiku DSS Public API — Plugins business capability. Self-contained, no shared references.
    resources:
    - name: plugins
      path: /plugins
      operations:
      - name: listplugins
        method: GET
        description: Dataiku List plugins
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: plugins-pluginId
      path: /plugins/{pluginId}
      operations:
      - name: getplugin
        method: GET
        description: Dataiku Get plugin details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-plugins-rest
    port: 8080
    description: REST adapter for Dataiku DSS Public API — Plugins. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/plugins
      name: plugins
      description: REST surface for plugins.
      operations:
      - method: GET
        name: listplugins
        description: Dataiku List plugins
        call: public-plugins.listplugins
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/plugins/{pluginid}
      name: plugins-pluginid
      description: REST surface for plugins-pluginId.
      operations:
      - method: GET
        name: getplugin
        description: Dataiku Get plugin details
        call: public-plugins.getplugin
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-plugins-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku DSS Public API — Plugins. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: dataiku-list-plugins
      description: Dataiku List plugins
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-plugins.listplugins
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-plugin-details
      description: Dataiku Get plugin details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-plugins.getplugin
      outputParameters:
      - type: object
        mapping: $.
