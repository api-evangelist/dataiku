naftiko: 1.0.0-alpha2
info:
  label: Dataiku DSS Public API — Meanings
  description: 'Dataiku DSS Public API — Meanings. 1 operations. Lead operation: Dataiku List meanings. Self-contained Naftiko
    capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Meanings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-meanings
    baseUri: https://{dss-host}/public/api
    description: Dataiku DSS Public API — Meanings business capability. Self-contained, no shared references.
    resources:
    - name: meanings
      path: /meanings
      operations:
      - name: listmeanings
        method: GET
        description: Dataiku List meanings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-meanings-rest
    port: 8080
    description: REST adapter for Dataiku DSS Public API — Meanings. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/meanings
      name: meanings
      description: REST surface for meanings.
      operations:
      - method: GET
        name: listmeanings
        description: Dataiku List meanings
        call: public-meanings.listmeanings
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-meanings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku DSS Public API — Meanings. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: dataiku-list-meanings
      description: Dataiku List meanings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-meanings.listmeanings
      outputParameters:
      - type: object
        mapping: $.
