naftiko: 1.0.0-alpha2
info:
  label: Dataiku DSS Public API — Managed Folders
  description: 'Dataiku DSS Public API — Managed Folders. 2 operations. Lead operation: Dataiku List managed folders. Self-contained
    Naftiko capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Managed Folders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-managed-folders
    baseUri: https://{dss-host}/public/api
    description: Dataiku DSS Public API — Managed Folders business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectKey-managedfolders
      path: /projects/{projectKey}/managedfolders
      operations:
      - name: listmanagedfolders
        method: GET
        description: Dataiku List managed folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-projectKey-managedfolders-folderId-contents
      path: /projects/{projectKey}/managedfolders/{folderId}/contents
      operations:
      - name: listmanagedfoldercontents
        method: GET
        description: Dataiku List managed folder contents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-managed-folders-rest
    port: 8080
    description: REST adapter for Dataiku DSS Public API — Managed Folders. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{projectkey}/managedfolders
      name: projects-projectkey-managedfolders
      description: REST surface for projects-projectKey-managedfolders.
      operations:
      - method: GET
        name: listmanagedfolders
        description: Dataiku List managed folders
        call: public-managed-folders.listmanagedfolders
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectkey}/managedfolders/{folderid}/contents
      name: projects-projectkey-managedfolders-folderid-contents
      description: REST surface for projects-projectKey-managedfolders-folderId-contents.
      operations:
      - method: GET
        name: listmanagedfoldercontents
        description: Dataiku List managed folder contents
        call: public-managed-folders.listmanagedfoldercontents
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-managed-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku DSS Public API — Managed Folders. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: dataiku-list-managed-folders
      description: Dataiku List managed folders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-managed-folders.listmanagedfolders
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-list-managed-folder-contents
      description: Dataiku List managed folder contents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-managed-folders.listmanagedfoldercontents
      outputParameters:
      - type: object
        mapping: $.
