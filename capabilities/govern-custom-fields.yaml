naftiko: 1.0.0-alpha2
info:
  label: Dataiku Govern API — Custom Fields
  description: 'Dataiku Govern API — Custom Fields. 2 operations. Lead operation: Dataiku Get artifact custom fields. Self-contained
    Naftiko capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Custom Fields
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: govern-custom-fields
    baseUri: https://{govern-host}/public/api
    description: Dataiku Govern API — Custom Fields business capability. Self-contained, no shared references.
    resources:
    - name: artifacts-artifactId-custom-fields
      path: /artifacts/{artifactId}/custom-fields
      operations:
      - name: getartifactcustomfields
        method: GET
        description: Dataiku Get artifact custom fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: setartifactcustomfields
        method: PUT
        description: Dataiku Set artifact custom fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: govern-custom-fields-rest
    port: 8080
    description: REST adapter for Dataiku Govern API — Custom Fields. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/artifacts/{artifactid}/custom-fields
      name: artifacts-artifactid-custom-fields
      description: REST surface for artifacts-artifactId-custom-fields.
      operations:
      - method: GET
        name: getartifactcustomfields
        description: Dataiku Get artifact custom fields
        call: govern-custom-fields.getartifactcustomfields
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: setartifactcustomfields
        description: Dataiku Set artifact custom fields
        call: govern-custom-fields.setartifactcustomfields
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: govern-custom-fields-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku Govern API — Custom Fields. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: dataiku-get-artifact-custom-fields
      description: Dataiku Get artifact custom fields
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: govern-custom-fields.getartifactcustomfields
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-set-artifact-custom-fields
      description: Dataiku Set artifact custom fields
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: govern-custom-fields.setartifactcustomfields
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
