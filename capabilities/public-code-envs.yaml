naftiko: 1.0.0-alpha2
info:
  label: Dataiku DSS Public API — Code Envs
  description: 'Dataiku DSS Public API — Code Envs. 2 operations. Lead operation: Dataiku List code environments. Self-contained
    Naftiko capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Code Envs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-code-envs
    baseUri: https://{dss-host}/public/api
    description: Dataiku DSS Public API — Code Envs business capability. Self-contained, no shared references.
    resources:
    - name: admin-code-envs
      path: /admin/code-envs
      operations:
      - name: listcodeenvs
        method: GET
        description: Dataiku List code environments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: admin-code-envs-envLang-envName
      path: /admin/code-envs/{envLang}/{envName}
      operations:
      - name: getcodeenv
        method: GET
        description: Dataiku Get code environment details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-code-envs-rest
    port: 8080
    description: REST adapter for Dataiku DSS Public API — Code Envs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/admin/code-envs
      name: admin-code-envs
      description: REST surface for admin-code-envs.
      operations:
      - method: GET
        name: listcodeenvs
        description: Dataiku List code environments
        call: public-code-envs.listcodeenvs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/admin/code-envs/{envlang}/{envname}
      name: admin-code-envs-envlang-envname
      description: REST surface for admin-code-envs-envLang-envName.
      operations:
      - method: GET
        name: getcodeenv
        description: Dataiku Get code environment details
        call: public-code-envs.getcodeenv
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-code-envs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku DSS Public API — Code Envs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: dataiku-list-code-environments
      description: Dataiku List code environments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-code-envs.listcodeenvs
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-code-environment-details
      description: Dataiku Get code environment details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-code-envs.getcodeenv
      outputParameters:
      - type: object
        mapping: $.
