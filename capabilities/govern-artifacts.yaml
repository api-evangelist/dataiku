naftiko: 1.0.0-alpha2
info:
  label: Dataiku Govern API — Artifacts
  description: 'Dataiku Govern API — Artifacts. 5 operations. Lead operation: Dataiku List artifacts. Self-contained Naftiko
    capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Artifacts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: govern-artifacts
    baseUri: https://{govern-host}/public/api
    description: Dataiku Govern API — Artifacts business capability. Self-contained, no shared references.
    resources:
    - name: artifacts
      path: /artifacts
      operations:
      - name: listartifacts
        method: GET
        description: Dataiku List artifacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: blueprintId
          in: query
          type: string
          description: Filter by blueprint ID
      - name: createartifact
        method: POST
        description: Dataiku Create an artifact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: artifacts-artifactId
      path: /artifacts/{artifactId}
      operations:
      - name: getartifact
        method: GET
        description: Dataiku Get artifact details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateartifact
        method: PUT
        description: Dataiku Update an artifact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteartifact
        method: DELETE
        description: Dataiku Delete an artifact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: govern-artifacts-rest
    port: 8080
    description: REST adapter for Dataiku Govern API — Artifacts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/artifacts
      name: artifacts
      description: REST surface for artifacts.
      operations:
      - method: GET
        name: listartifacts
        description: Dataiku List artifacts
        call: govern-artifacts.listartifacts
        with:
          blueprintId: rest.blueprintId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createartifact
        description: Dataiku Create an artifact
        call: govern-artifacts.createartifact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/artifacts/{artifactid}
      name: artifacts-artifactid
      description: REST surface for artifacts-artifactId.
      operations:
      - method: GET
        name: getartifact
        description: Dataiku Get artifact details
        call: govern-artifacts.getartifact
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateartifact
        description: Dataiku Update an artifact
        call: govern-artifacts.updateartifact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteartifact
        description: Dataiku Delete an artifact
        call: govern-artifacts.deleteartifact
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: govern-artifacts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku Govern API — Artifacts. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: dataiku-list-artifacts
      description: Dataiku List artifacts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: govern-artifacts.listartifacts
      with:
        blueprintId: tools.blueprintId
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-create-artifact
      description: Dataiku Create an artifact
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: govern-artifacts.createartifact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-artifact-details
      description: Dataiku Get artifact details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: govern-artifacts.getartifact
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-update-artifact
      description: Dataiku Update an artifact
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: govern-artifacts.updateartifact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-delete-artifact
      description: Dataiku Delete an artifact
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: govern-artifacts.deleteartifact
      outputParameters:
      - type: object
        mapping: $.
