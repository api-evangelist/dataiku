naftiko: 1.0.0-alpha2
info:
  label: Dataiku API Node Administration API — Metrics
  description: 'Dataiku API Node Administration API — Metrics. 2 operations. Lead operation: Dataiku Get API node health.
    Self-contained Naftiko capability covering one Dataiku business surface.'
  tags:
  - Dataiku
  - Metrics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DATAIKU_API_KEY: DATAIKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: api-node-admin-metrics
    baseUri: https://{apinode-host}:{port}/admin/api
    description: Dataiku API Node Administration API — Metrics business capability. Self-contained, no shared references.
    resources:
    - name: health
      path: /health
      operations:
      - name: gethealth
        method: GET
        description: Dataiku Get API node health
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: metrics
      path: /metrics
      operations:
      - name: getmetrics
        method: GET
        description: Dataiku Get API node metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.DATAIKU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: api-node-admin-metrics-rest
    port: 8080
    description: REST adapter for Dataiku API Node Administration API — Metrics. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/health
      name: health
      description: REST surface for health.
      operations:
      - method: GET
        name: gethealth
        description: Dataiku Get API node health
        call: api-node-admin-metrics.gethealth
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/metrics
      name: metrics
      description: REST surface for metrics.
      operations:
      - method: GET
        name: getmetrics
        description: Dataiku Get API node metrics
        call: api-node-admin-metrics.getmetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: api-node-admin-metrics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dataiku API Node Administration API — Metrics. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: dataiku-get-api-node-health
      description: Dataiku Get API node health
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-node-admin-metrics.gethealth
      outputParameters:
      - type: object
        mapping: $.
    - name: dataiku-get-api-node-metrics
      description: Dataiku Get API node metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-node-admin-metrics.getmetrics
      outputParameters:
      - type: object
        mapping: $.
