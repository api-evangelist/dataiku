openapi: 3.2.0
info:
  title: Dataiku DSS Public Global API Keys API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Global API Keys
  description: Manage global API keys
paths:
  /admin/globalAPIKeys:
    get:
      operationId: listGlobalAPIKeys
      summary: Dataiku List global API keys
      description: List all global API keys on the DSS instance.
      tags:
      - Global API Keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalAPIKey'
        '401':
          description: Unauthorized
components:
  schemas:
    GlobalAPIKey:
      type: object
      properties:
        id:
          type: string
          description: API key identifier
        key:
          type: string
          description: The API key value
        label:
          type: string
          description: Label for the API key
        createdOn:
          type: integer
          format: int64
          description: Creation timestamp
        createdBy:
          type: string
          description: User who created the key
        globalPermissions:
          type: object
          description: Global permissions granted
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
