openapi: 3.2.0
info:
  title: Dataiku DSS Public Saved Models API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Saved Models
  description: Manage trained machine learning models
paths:
  /projects/{projectKey}/savedmodels:
    get:
      operationId: listSavedModels
      summary: Dataiku List saved models
      description: List all saved models in a project.
      tags:
      - Saved Models
      parameters:
      - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of saved models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedModelSummary'
        '404':
          description: Project not found
  /projects/{projectKey}/savedmodels/{savedModelId}:
    get:
      operationId: getSavedModel
      summary: Dataiku Get saved model details
      description: Get details of a saved model including its active version.
      tags:
      - Saved Models
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - $ref: '#/components/parameters/savedModelId'
      responses:
        '200':
          description: Saved model details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedModel'
        '404':
          description: Saved model not found
components:
  parameters:
    savedModelId:
      name: savedModelId
      in: path
      required: true
      description: Saved model identifier
      schema:
        type: string
    projectKey:
      name: projectKey
      in: path
      required: true
      description: Unique project key identifier
      schema:
        type: string
  schemas:
    ModelVersion:
      type: object
      properties:
        id:
          type: string
          description: Version identifier
        active:
          type: boolean
          description: Whether this is the active version
        snippet:
          type: object
          description: Summary metrics for the model version
    SavedModel:
      type: object
      properties:
        projectKey:
          type: string
          description: Project key
        id:
          type: string
          description: Saved model identifier
        name:
          type: string
          description: Saved model name
        type:
          type: string
          description: Model type
        activeVersion:
          type: string
          description: Identifier of the active model version
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ModelVersion'
    SavedModelSummary:
      type: object
      properties:
        projectKey:
          type: string
          description: Project key
        id:
          type: string
          description: Saved model identifier
        name:
          type: string
          description: Saved model name
        type:
          type: string
          description: Model type (PREDICTION or CLUSTERING)
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
