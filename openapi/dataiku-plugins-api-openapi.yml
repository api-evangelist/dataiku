openapi: 3.2.0
info:
  title: Dataiku DSS Public Plugins API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Plugins
  description: Manage DSS plugins
paths:
  /plugins:
    get:
      operationId: listPlugins
      summary: Dataiku List plugins
      description: List all installed plugins on the DSS instance.
      tags:
      - Plugins
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PluginSummary'
        '401':
          description: Unauthorized
  /plugins/{pluginId}:
    get:
      operationId: getPlugin
      summary: Dataiku Get plugin details
      description: Get the details of an installed plugin.
      tags:
      - Plugins
      parameters:
      - $ref: '#/components/parameters/pluginId'
      responses:
        '200':
          description: Plugin details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '404':
          description: Plugin not found
components:
  parameters:
    pluginId:
      name: pluginId
      in: path
      required: true
      description: Plugin identifier
      schema:
        type: string
  schemas:
    PluginSummary:
      type: object
      properties:
        id:
          type: string
          description: Plugin identifier
        version:
          type: string
          description: Plugin version
        label:
          type: string
          description: Display label
        installedOn:
          type: integer
          format: int64
          description: Installation timestamp
    Plugin:
      type: object
      properties:
        id:
          type: string
          description: Plugin identifier
        version:
          type: string
          description: Plugin version
        label:
          type: string
          description: Display label
        description:
          type: string
          description: Plugin description
        author:
          type: string
          description: Plugin author
        installedOn:
          type: integer
          format: int64
          description: Installation timestamp
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
