openapi: 3.2.0
info:
  title: Dataiku DSS Public Groups API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Groups
  description: Manage DSS groups
paths:
  /admin/groups:
    get:
      operationId: listGroups
      summary: Dataiku List groups
      description: List all groups on the DSS instance.
      tags:
      - Groups
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
  /admin/groups/{groupName}:
    get:
      operationId: getGroup
      summary: Dataiku Get group details
      description: Get the details of a specific group.
      tags:
      - Groups
      parameters:
      - $ref: '#/components/parameters/groupName'
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
components:
  schemas:
    Group:
      type: object
      properties:
        name:
          type: string
          description: Group name
        description:
          type: string
          description: Group description
        admin:
          type: boolean
          description: Whether this is an admin group
        sourceType:
          type: string
          description: Group source type (LOCAL, LDAP)
  parameters:
    groupName:
      name: groupName
      in: path
      required: true
      description: Group name
      schema:
        type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
