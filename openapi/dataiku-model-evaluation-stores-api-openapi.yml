openapi: 3.2.0
info:
  title: Dataiku DSS Public Model Evaluation Stores API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Model Evaluation Stores
  description: Manage model evaluation stores
paths:
  /projects/{projectKey}/modelevaluationstores:
    get:
      operationId: listModelEvaluationStores
      summary: Dataiku List model evaluation stores
      description: List all model evaluation stores in a project.
      tags:
      - Model Evaluation Stores
      parameters:
      - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of model evaluation stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelEvaluationStoreSummary'
        '404':
          description: Project not found
components:
  schemas:
    ModelEvaluationStoreSummary:
      type: object
      properties:
        projectKey:
          type: string
          description: Project key
        id:
          type: string
          description: Model evaluation store identifier
        name:
          type: string
          description: Display name
  parameters:
    projectKey:
      name: projectKey
      in: path
      required: true
      description: Unique project key identifier
      schema:
        type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
