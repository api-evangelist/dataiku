openapi: 3.1.0
info:
  title: Dataiku API Node Administration Artifact Sign-Offs Model Evaluation Stores API
  description: REST API for administering Dataiku API Nodes, managing deployed services, service generations, prediction endpoints, and authentication keys for real-time API serving of machine learning models and data lookups.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{apinode-host}:{port}/admin/api
  description: Dataiku API Node Instance
  variables:
    apinode-host:
      default: apinode.example.com
      description: Hostname of the Dataiku API Node
    port:
      default: '12443'
      description: Admin API port
security:
- apiKeyAuth: []
tags:
- name: Model Evaluation Stores
  description: Manage model evaluation stores
paths:
  /projects/{projectKey}/modelevaluationstores:
    get:
      operationId: listModelEvaluationStores
      summary: Dataiku List model evaluation stores
      description: List all model evaluation stores in a project.
      tags:
      - Model Evaluation Stores
      parameters:
      - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of model evaluation stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelEvaluationStoreSummary'
        '404':
          description: Project not found
components:
  parameters:
    projectKey:
      name: projectKey
      in: path
      required: true
      description: Unique project key identifier
      schema:
        type: string
  schemas:
    ModelEvaluationStoreSummary:
      type: object
      properties:
        projectKey:
          type: string
          description: Project key
        id:
          type: string
          description: Model evaluation store identifier
        name:
          type: string
          description: Display name
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Admin API key passed as Bearer token
externalDocs:
  description: Dataiku API Node Administration Documentation
  url: https://doc.dataiku.com/dss/latest/apinode/api/admin-api.html
