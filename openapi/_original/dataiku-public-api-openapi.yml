      schema:
        type: string
    datasetName:
      name: datasetName
      in: path
      required: true
      description: Dataset name within the project
      schema:
        type: string
    recipeName:
      name: recipeName
      in: path
      required: true
      description: Recipe name within the project
      schema:
        type: string
    jobId:
      name: jobId
      in: path
      required: true
      description: Unique job identifier
      schema:
        type: string
    scenarioId:
      name: scenarioId
      in: path
      required: true
      description: Scenario identifier
      schema:
        type: string
    folderId:
      name: folderId
      in: path
      required: true
      description: Managed folder identifier
      schema:
        type: string
    savedModelId:
      name: savedModelId
      in: path
      required: true
      description: Saved model identifier
      schema:
        type: string
    connectionName:
      name: connectionName
      in: path
      required: true
      description: Connection name
      schema:
        type: string
    envLang:
      name: envLang
      in: path
      required: true
      description: Code environment language (PYTHON or R)
      schema:
        type: string
        enum:
          - PYTHON
          - R
    envName:
      name: envName
      in: path
      required: true
      description: Code environment name
      schema:
        type: string
    login:
      name: login
      in: path
      required: true
      description: User login name
      schema:
        type: string
    groupName:
      name: groupName
      in: path
      required: true
      description: Group name
      schema:
        type: string
    pluginId:
      name: pluginId
      in: path
      required: true
      description: Plugin identifier
      schema:
        type: string
  schemas:
    ProjectSummary:
      type: object
      properties:
        projectKey:
          type: string
          description: Unique project key
        name:
          type: string
          description: Display name of the project
        owner:
          type: string
          description: Login of the project owner
        projectStatus:
          type: string
          description: Current status of the project
    CreateProjectRequest:
      type: object
      required:
        - projectKey
        - name
      properties:
        projectKey:
          type: string
          description: Unique project key (uppercase letters and numbers)
          pattern: '^[A-Z][A-Z0-9_]*$'
        name:
          type: string
          description: Display name for the project
        owner:
          type: string
          description: Login of the project owner
    Project:
      type: object
      properties:
        projectKey:
          type: string
          description: Unique project key
        name:
          type: string
          description: Display name of the project
        owner:
          type: string
          description: Login of the project owner
        projectStatus:
          type: string
          description: Current status of the project
        creationTag:
          $ref: '#/components/schemas/Tag'
        versionTag:
          $ref: '#/components/schemas/Tag'
        description:
          type: string
          description: Short description of the project
    ProjectMetadata:
      type: object
      properties:
        label:
          type: string
          description: Display label for the project
        description:
          type: string
          description: Project description
        shortDesc:
          type: string
          description: Short description
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the project
        checklists:
          type: object
          description: Checklists for the project
    Tag:
      type: object
