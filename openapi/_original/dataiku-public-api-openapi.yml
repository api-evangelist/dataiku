openapi: 3.1.0
info:
  title: Dataiku DSS Public API
  description: >-
    REST API for managing Dataiku DSS instances, projects, datasets, recipes,
    jobs, scenarios, models, and other platform resources programmatically.
    Provides full control over DSS operations including data preparation,
    machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
servers:
  - url: https://{dss-host}/public/api
    description: Dataiku DSS Instance
    variables:
      dss-host:
        default: dss.example.com
        description: Hostname of the Dataiku DSS instance
tags:
  - name: Bundles
    description: Import and export project bundles
  - name: Code Envs
    description: Manage code environments for Python and R
  - name: Connections
    description: Manage data connections
  - name: Datasets
    description: Manage datasets within projects
  - name: General Settings
    description: Manage instance-level settings
  - name: Global API Keys
    description: Manage global API keys
  - name: Groups
    description: Manage DSS groups
  - name: Jobs
    description: Run and monitor build jobs
  - name: Managed Folders
    description: Manage folders for unstructured data
  - name: Meanings
    description: Manage user-defined meanings
  - name: Model Evaluation Stores
    description: Manage model evaluation stores
  - name: Plugins
    description: Manage DSS plugins
  - name: Projects
    description: Manage DSS projects
  - name: Recipes
    description: Manage recipes and data transformations
  - name: Saved Models
    description: Manage trained machine learning models
  - name: Scenarios
    description: Manage and trigger automation scenarios
  - name: SQL Queries
    description: Execute SQL queries on connections
  - name: Users
    description: Manage DSS users
security:
  - apiKeyAuth: []
paths:
  /projects:
    get:
      operationId: listProjects
      summary: Dataiku List projects
      description: Retrieve a list of all projects the API key has access to.
      tags:
        - Projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          description: Unauthorized
    post:
      operationId: createProject
      summary: Dataiku Create a project
      description: Create a new DSS project.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '409':
          description: Project key already exists
  /projects/{projectKey}:
    get:
      operationId: getProject
      summary: Dataiku Get project details
      description: Retrieve metadata and settings for a specific project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '404':
          description: Project not found
    delete:
      operationId: deleteProject
      summary: Dataiku Delete a project
      description: Delete a project and all its contents.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '204':
          description: Project deleted
        '401':
          description: Unauthorized
        '404':
          description: Project not found
  /projects/{projectKey}/metadata:
    get:
      operationId: getProjectMetadata
      summary: Dataiku Get project metadata
      description: Retrieve metadata (labels, description, tags, etc.) for a project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: Project metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMetadata'
        '404':
          description: Project not found
    put:
      operationId: setProjectMetadata
      summary: Dataiku Set project metadata
      description: Update metadata for a project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMetadata'
      responses:
        '200':
          description: Metadata updated
        '404':
          description: Project not found
  /projects/{projectKey}/datasets:
    get:
      operationId: listDatasets
      summary: Dataiku List datasets
      description: List all datasets in a project.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
        '404':
          description: Project not found
    post:
      operationId: createDataset
      summary: Dataiku Create a dataset
      description: Create a new dataset in the project.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
      responses:
        '200':
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          description: Invalid request
        '409':
          description: Dataset name already exists
  /projects/{projectKey}/datasets/{datasetName}:
    get:
      operationId: getDataset
      summary: Dataiku Get dataset details
      description: Get the definition and schema of a dataset.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/datasetName'
      responses:
        '200':
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          description: Dataset not found
    put:
      operationId: updateDataset
      summary: Dataiku Update a dataset
      description: Update the definition of a dataset.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/datasetName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dataset'
      responses:
        '200':
          description: Dataset updated
        '404':
          description: Dataset not found
    delete:
      operationId: deleteDataset
      summary: Dataiku Delete a dataset
      description: Delete a dataset from the project.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/datasetName'
      responses:
        '204':
          description: Dataset deleted
        '404':
          description: Dataset not found
  /projects/{projectKey}/datasets/{datasetName}/data:
    get:
      operationId: getDatasetData
      summary: Dataiku Read dataset data
      description: >-
        Read rows from a dataset. Returns data in JSON format with columns and
        rows.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/datasetName'
        - name: limit
          in: query
          description: Maximum number of rows to return
          schema:
            type: integer
            default: 20000
        - name: partitions
          in: query
          description: Comma-separated list of partition identifiers to read from
          schema:
            type: string
      responses:
        '200':
          description: Dataset data rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetData'
        '404':
          description: Dataset not found
  /projects/{projectKey}/datasets/{datasetName}/schema:
    get:
      operationId: getDatasetSchema
      summary: Dataiku Get dataset schema
      description: Get the schema (column names and types) of a dataset.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/datasetName'
      responses:
        '200':
          description: Dataset schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSchema'
        '404':
          description: Dataset not found
    put:
      operationId: setDatasetSchema
      summary: Dataiku Set dataset schema
      description: Update the schema of a dataset.
      tags:
        - Datasets
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/datasetName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSchema'
      responses:
        '200':
          description: Schema updated
        '404':
          description: Dataset not found
  /projects/{projectKey}/recipes:
    get:
      operationId: listRecipes
      summary: Dataiku List recipes
      description: List all recipes in a project.
      tags:
        - Recipes
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
        '404':
          description: Project not found
  /projects/{projectKey}/recipes/{recipeName}:
    get:
      operationId: getRecipe
      summary: Dataiku Get recipe details
      description: Get the full definition of a recipe.
      tags:
        - Recipes
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/recipeName'
      responses:
        '200':
          description: Recipe details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '404':
          description: Recipe not found
    delete:
      operationId: deleteRecipe
      summary: Dataiku Delete a recipe
      description: Delete a recipe from the project.
      tags:
        - Recipes
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/recipeName'
      responses:
        '204':
          description: Recipe deleted
        '404':
          description: Recipe not found
  /projects/{projectKey}/jobs:
    get:
      operationId: listJobs
      summary: Dataiku List jobs
      description: List jobs in a project.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummary'
        '404':
          description: Project not found
    post:
      operationId: startJob
      summary: Dataiku Start a new job
      description: Start a new build job in the project.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/projectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJobRequest'
      responses:
        '200':
          description: Job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid request
  /projects/{projectKey}/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Dataiku Get job status
      description: Retrieve the status and details of a specific job.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
    delete:
      operationId: abortJob
      summary: Dataiku Abort a job
      description: Abort a running job.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/jobId'
      responses:
        '204':
          description: Job aborted
        '404':
          description: Job not found
  /projects/{projectKey}/scenarios:
    get:
      operationId: listScenarios
      summary: Dataiku List scenarios
      description: List all scenarios in a project.
      tags:
        - Scenarios
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
        '404':
          description: Project not found
  /projects/{projectKey}/scenarios/{scenarioId}:
    get:
      operationId: getScenario
      summary: Dataiku Get scenario details
      description: Get the full definition of a scenario.
      tags:
        - Scenarios
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/scenarioId'
      responses:
        '200':
          description: Scenario details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          description: Scenario not found
  /projects/{projectKey}/scenarios/{scenarioId}/run:
    post:
      operationId: runScenario
      summary: Dataiku Run a scenario
      description: Trigger execution of a scenario.
      tags:
        - Scenarios
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/scenarioId'
      responses:
        '200':
          description: Scenario run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'
        '404':
          description: Scenario not found
  /projects/{projectKey}/scenarios/{scenarioId}/light:
    get:
      operationId: getScenarioRunStatus
      summary: Dataiku Get scenario run status
      description: Get lightweight status of the last runs of a scenario.
      tags:
        - Scenarios
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/scenarioId'
      responses:
        '200':
          description: Scenario run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLight'
        '404':
          description: Scenario not found
  /projects/{projectKey}/managedfolders:
    get:
      operationId: listManagedFolders
      summary: Dataiku List managed folders
      description: List all managed folders in a project.
      tags:
        - Managed Folders
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of managed folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedFolder'
        '404':
          description: Project not found
  /projects/{projectKey}/managedfolders/{folderId}/contents:
    get:
      operationId: listManagedFolderContents
      summary: Dataiku List managed folder contents
      description: List the files in a managed folder.
      tags:
        - Managed Folders
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/folderId'
      responses:
        '200':
          description: Folder contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFolderContents'
        '404':
          description: Managed folder not found
  /projects/{projectKey}/savedmodels:
    get:
      operationId: listSavedModels
      summary: Dataiku List saved models
      description: List all saved models in a project.
      tags:
        - Saved Models
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of saved models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedModelSummary'
        '404':
          description: Project not found
  /projects/{projectKey}/savedmodels/{savedModelId}:
    get:
      operationId: getSavedModel
      summary: Dataiku Get saved model details
      description: Get details of a saved model including its active version.
      tags:
        - Saved Models
      parameters:
        - $ref: '#/components/parameters/projectKey'
        - $ref: '#/components/parameters/savedModelId'
      responses:
        '200':
          description: Saved model details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedModel'
        '404':
          description: Saved model not found
  /projects/{projectKey}/modelevaluationstores:
    get:
      operationId: listModelEvaluationStores
      summary: Dataiku List model evaluation stores
      description: List all model evaluation stores in a project.
      tags:
        - Model Evaluation Stores
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of model evaluation stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelEvaluationStoreSummary'
        '404':
          description: Project not found
  /projects/{projectKey}/bundles:
    get:
      operationId: listBundles
      summary: Dataiku List bundles
      description: List all exported bundles of a project.
      tags:
        - Bundles
      parameters:
        - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BundleSummary'
        '404':
          description: Project not found
    post:
      operationId: createBundle
      summary: Dataiku Create a bundle
      description: Create a new export bundle for the project.
      tags:
        - Bundles
      parameters:
        - $ref: '#/components/parameters/projectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequest'
      responses:
        '200':
          description: Bundle created
        '400':
          description: Invalid request
  /sql/queries:
    post:
      operationId: executeSqlQuery
      summary: Dataiku Execute a SQL query
      description: >-
        Execute a SQL query on a DSS connection and retrieve the results.
      tags:
        - SQL Queries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlQueryResult'
        '400':
          description: Invalid query
  /admin/connections:
    get:
      operationId: listConnections
      summary: Dataiku List connections
      description: List all data connections configured on the DSS instance.
      tags:
        - Connections
      responses:
        '200':
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionSummary'
        '401':
          description: Unauthorized
  /admin/connections/{connectionName}:
    get:
      operationId: getConnection
      summary: Dataiku Get connection details
      description: Get the full definition of a connection.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/connectionName'
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          description: Connection not found
  /admin/code-envs:
    get:
      operationId: listCodeEnvs
      summary: Dataiku List code environments
      description: List all code environments on the DSS instance.
      tags:
        - Code Envs
      responses:
        '200':
          description: List of code environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeEnvSummary'
        '401':
          description: Unauthorized
  /admin/code-envs/{envLang}/{envName}:
    get:
      operationId: getCodeEnv
      summary: Dataiku Get code environment details
      description: Get the definition of a code environment.
      tags:
        - Code Envs
      parameters:
        - $ref: '#/components/parameters/envLang'
        - $ref: '#/components/parameters/envName'
      responses:
        '200':
          description: Code environment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeEnv'
        '404':
          description: Code environment not found
  /admin/users:
    get:
      operationId: listUsers
      summary: Dataiku List users
      description: List all users on the DSS instance.
      tags:
        - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    post:
      operationId: createUser
      summary: Dataiku Create a user
      description: Create a new user on the DSS instance.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
        '409':
          description: User already exists
  /admin/users/{login}:
    get:
      operationId: getUser
      summary: Dataiku Get user details
      description: Get the details of a specific user.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/login'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      operationId: updateUser
      summary: Dataiku Update a user
      description: Update the details of a user.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
        '404':
          description: User not found
    delete:
      operationId: deleteUser
      summary: Dataiku Delete a user
      description: Delete a user from the DSS instance.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/login'
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
  /admin/groups:
    get:
      operationId: listGroups
      summary: Dataiku List groups
      description: List all groups on the DSS instance.
      tags:
        - Groups
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
  /admin/groups/{groupName}:
    get:
      operationId: getGroup
      summary: Dataiku Get group details
      description: Get the details of a specific group.
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/groupName'
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
  /admin/globalAPIKeys:
    get:
      operationId: listGlobalAPIKeys
      summary: Dataiku List global API keys
      description: List all global API keys on the DSS instance.
      tags:
        - Global API Keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalAPIKey'
        '401':
          description: Unauthorized
  /admin/general-settings:
    get:
      operationId: getGeneralSettings
      summary: Dataiku Get general settings
      description: Get the general settings of the DSS instance.
      tags:
        - General Settings
      responses:
        '200':
          description: General settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        '401':
          description: Unauthorized
    put:
      operationId: setGeneralSettings
      summary: Dataiku Update general settings
      description: Update the general settings of the DSS instance.
      tags:
        - General Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralSettings'
      responses:
        '200':
          description: Settings updated
        '401':
          description: Unauthorized
  /meanings:
    get:
      operationId: listMeanings
      summary: Dataiku List meanings
      description: List all user-defined meanings on the DSS instance.
      tags:
        - Meanings
      responses:
        '200':
          description: List of meanings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meaning'
        '401':
          description: Unauthorized
  /plugins:
    get:
      operationId: listPlugins
      summary: Dataiku List plugins
      description: List all installed plugins on the DSS instance.
      tags:
        - Plugins
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PluginSummary'
        '401':
          description: Unauthorized
  /plugins/{pluginId}:
    get:
      operationId: getPlugin
      summary: Dataiku Get plugin details
      description: Get the details of an installed plugin.
      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/pluginId'
      responses:
        '200':
          description: Plugin details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '404':
          description: Plugin not found
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
