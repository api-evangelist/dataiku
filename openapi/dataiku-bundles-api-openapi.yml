openapi: 3.2.0
info:
  title: Dataiku DSS Public Bundles API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Bundles
  description: Import and export project bundles
paths:
  /projects/{projectKey}/bundles:
    get:
      operationId: listBundles
      summary: Dataiku List bundles
      description: List all exported bundles of a project.
      tags:
      - Bundles
      parameters:
      - $ref: '#/components/parameters/projectKey'
      responses:
        '200':
          description: List of bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BundleSummary'
        '404':
          description: Project not found
    post:
      operationId: createBundle
      summary: Dataiku Create a bundle
      description: Create a new export bundle for the project.
      tags:
      - Bundles
      parameters:
      - $ref: '#/components/parameters/projectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequest'
      responses:
        '200':
          description: Bundle created
        '400':
          description: Invalid request
components:
  parameters:
    projectKey:
      name: projectKey
      in: path
      required: true
      description: Unique project key identifier
      schema:
        type: string
  schemas:
    CreateBundleRequest:
      type: object
      required:
      - bundleId
      properties:
        bundleId:
          type: string
          description: Identifier for the new bundle
    BundleSummary:
      type: object
      properties:
        id:
          type: string
          description: Bundle identifier
        projectKey:
          type: string
          description: Project key
        createdOn:
          type: integer
          format: int64
          description: Creation timestamp
        createdBy:
          type: string
          description: User who created the bundle
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
