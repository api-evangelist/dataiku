openapi: 3.2.0
info:
  title: Dataiku DSS Public SQL Queries API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: SQL Queries
  description: Execute SQL queries on connections
paths:
  /sql/queries:
    post:
      operationId: executeSqlQuery
      summary: Dataiku Execute a SQL query
      description: Execute a SQL query on a DSS connection and retrieve the results.
      tags:
      - SQL Queries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlQueryResult'
        '400':
          description: Invalid query
components:
  schemas:
    SqlQueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
          description: Column names
        rows:
          type: array
          items:
            type: array
            items:
              type: string
          description: Result rows
    SqlQueryRequest:
      type: object
      required:
      - connection
      - query
      properties:
        connection:
          type: string
          description: Name of the DSS connection to query
        query:
          type: string
          description: SQL query to execute
        preQueries:
          type: array
          items:
            type: string
          description: SQL statements to execute before the main query
        postQueries:
          type: array
          items:
            type: string
          description: SQL statements to execute after the main query
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
