openapi: 3.2.0
info:
  title: Dataiku DSS Public Connections API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: Connections
  description: Manage data connections
paths:
  /admin/connections:
    get:
      operationId: listConnections
      summary: Dataiku List connections
      description: List all data connections configured on the DSS instance.
      tags:
      - Connections
      responses:
        '200':
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionSummary'
        '401':
          description: Unauthorized
  /admin/connections/{connectionName}:
    get:
      operationId: getConnection
      summary: Dataiku Get connection details
      description: Get the full definition of a connection.
      tags:
      - Connections
      parameters:
      - $ref: '#/components/parameters/connectionName'
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          description: Connection not found
components:
  schemas:
    Connection:
      type: object
      properties:
        name:
          type: string
          description: Connection name
        type:
          type: string
          description: Connection type
        params:
          type: object
          description: Connection-specific parameters
        allowWrite:
          type: boolean
          description: Whether write operations are allowed
        allowManagedDatasets:
          type: boolean
          description: Whether managed datasets are allowed
    ConnectionSummary:
      type: object
      properties:
        name:
          type: string
          description: Connection name
        type:
          type: string
          description: Connection type (e.g., PostgreSQL, S3, HDFS)
  parameters:
    connectionName:
      name: connectionName
      in: path
      required: true
      description: Connection name
      schema:
        type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
