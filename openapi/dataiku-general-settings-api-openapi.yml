openapi: 3.2.0
info:
  title: Dataiku DSS Public General Settings API
  description: REST API for managing Dataiku DSS instances, projects, datasets, recipes, jobs, scenarios, models, and other platform resources programmatically. Provides full control over DSS operations including data preparation, machine learning model management, and workflow automation.
  version: '13.0'
  contact:
    name: Dataiku Support
    url: https://www.dataiku.com/support
    email: support@dataiku.com
  termsOfService: https://www.dataiku.com/terms/
servers:
- url: https://{dss-host}/public/api
  description: Dataiku DSS Instance
  variables:
    dss-host:
      default: dss.example.com
      description: Hostname of the Dataiku DSS instance
security:
- apiKeyAuth: []
tags:
- name: General Settings
  description: Manage instance-level settings
paths:
  /admin/general-settings:
    get:
      operationId: getGeneralSettings
      summary: Dataiku Get general settings
      description: Get the general settings of the DSS instance.
      tags:
      - General Settings
      responses:
        '200':
          description: General settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        '401':
          description: Unauthorized
    put:
      operationId: setGeneralSettings
      summary: Dataiku Update general settings
      description: Update the general settings of the DSS instance.
      tags:
      - General Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralSettings'
      responses:
        '200':
          description: Settings updated
        '401':
          description: Unauthorized
components:
  schemas:
    GeneralSettings:
      type: object
      properties:
        permissions:
          type: object
          description: Global permission settings
        ldapSettings:
          type: object
          description: LDAP configuration
        ssoSettings:
          type: object
          description: SSO configuration
        theme:
          type: object
          description: UI theme settings
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication. Pass the API key as a Bearer token in the Authorization header.
externalDocs:
  description: Dataiku DSS Public API Documentation
  url: https://doc.dataiku.com/dss/latest/publicapi/rest/index.html
